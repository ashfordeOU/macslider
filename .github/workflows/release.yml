name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Created from the selected branch if missing."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MACSLIDER_SIGNING_CERT: ${{ secrets.MACSLIDER_SIGNING_CERT }}
      MACSLIDER_SIGNING_PASSWORD: ${{ secrets.MACSLIDER_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "VERSION (${version}) does not match tag ${TAG}" >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Import signing certificate
        # Signing with the same certificate every release keeps macOS
        # permissions across updates. See scripts/make-signing-cert.sh.
        if: env.MACSLIDER_SIGNING_CERT != ''
        run: scripts/ci-import-signing-cert.sh
      - name: Warn about ad-hoc signing
        if: env.MACSLIDER_SIGNING_CERT == ''
        run: echo "::warning::MACSLIDER_SIGNING_CERT is not set; this release is signed ad hoc and users must re-grant Accessibility after updating."
      - name: Build app
        run: scripts/build-app.sh
      - name: Package
        run: scripts/package.sh
      - name: Release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Download **MacSlider-*.dmg**, drag MacSlider to Applications, then open it and allow Accessibility access.
          Or install from Terminal:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/ashfordeOU/macslider/main/scripts/install.sh | bash
          ```
          This build is not notarized. If macOS says it can't verify the developer, open **System Settings → Privacy & Security** and click **Open Anyway**.
          NOTES
      - name: Publish
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg dist/SHA256SUMS \
              --title "MacSlider ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"
          fi
