name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: MacSlider-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
